<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" style="color:#1f2a24" viewBox="0 0 940 300" role="img" aria-label="Flow of a Start: read the table file, version check, read the host record, claim it if free, pull the newest usable copy, start the server, then heartbeat and uploads while hosting.">
<style>
text{font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;font-size:12px;fill:#1f2a24}
.mono{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11px}
.small{font-size:10.5px;fill:#5d6a63}
.title{font-size:13px;font-weight:600}
.box{fill:#ffffff;stroke:#1f2a24;stroke-width:1.2}
.soft{fill:#d9ece2;stroke:#1f6f4a;stroke-width:1.2}
.warnbox{fill:none;stroke:#9a5b00;stroke-width:1.2;stroke-dasharray:4 3}
.edge{fill:none;stroke:#1f2a24;stroke-width:1.1}
.edge.hot{stroke:#1f6f4a;stroke-width:1.6}
.edge.dashed{stroke-dasharray:5 4}
.lane{stroke:#c9cfc9;stroke-width:1}
</style>
<rect width="100%" height="100%" fill="#f6f5f1"/>

<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2a24"/></marker></defs>
<g>
<rect x="20" y="60" width="120" height="56" rx="5" class="box"/>
<text x="80" y="83" text-anchor="middle" class="title">table.json</text><text x="80" y="100" text-anchor="middle" class="small">read or created</text>
<path d="M140 88 L175 88" class="edge" marker-end="url(#a3)"/>
<polygon points="240,52 300,88 240,124 180,88" class="box"/>
<text x="240" y="84" text-anchor="middle" class="small">same</text><text x="240" y="98" text-anchor="middle" class="small">version?</text>
<path d="M240 124 L240 170" class="edge" marker-end="url(#a3)"/>
<rect x="160" y="170" width="160" height="50" rx="5" class="warnbox"/>
<text x="240" y="190" text-anchor="middle" class="small">no: install that version,</text><text x="240" y="206" text-anchor="middle" class="small">or the administrator moves the table</text>
<path d="M300 88 L340 88" class="edge" marker-end="url(#a3)"/>
<text x="320" y="80" text-anchor="middle" class="small">yes</text>
<rect x="340" y="60" width="120" height="56" rx="5" class="box"/>
<text x="400" y="83" text-anchor="middle" class="title">host.json</text><text x="400" y="100" text-anchor="middle" class="small">who holds it, how old</text>
<path d="M460 88 L495 88" class="edge" marker-end="url(#a3)"/>
<polygon points="560,52 620,88 560,124 500,88" class="box"/>
<text x="560" y="84" text-anchor="middle" class="small">held by</text><text x="560" y="98" text-anchor="middle" class="small">someone?</text>
<path d="M560 124 L560 170" class="edge" marker-end="url(#a3)"/>
<rect x="470" y="170" width="180" height="50" rx="5" class="warnbox"/>
<text x="560" y="190" text-anchor="middle" class="small">yes: refused. Join them, or the</text><text x="560" y="206" text-anchor="middle" class="small">administrator asks to hand over</text>
<path d="M620 88 L660 88" class="edge" marker-end="url(#a3)"/>
<text x="640" y="80" text-anchor="middle" class="small">no</text>
<rect x="660" y="60" width="120" height="56" rx="5" class="soft"/>
<text x="720" y="83" text-anchor="middle" class="title">claim</text><text x="720" y="100" text-anchor="middle" class="small">epoch + 1, on its rev</text>
<path d="M780 88 L815 88" class="edge" marker-end="url(#a3)"/>
<rect x="815" y="60" width="110" height="56" rx="5" class="box"/>
<text x="870" y="83" text-anchor="middle" class="title">pull</text><text x="870" y="100" text-anchor="middle" class="small">newest usable copy</text>
<path d="M870 116 L870 180 L820 180" class="edge" marker-end="url(#a3)"/>
<rect x="700" y="160" width="120" height="44" rx="5" class="box"/>
<text x="760" y="179" text-anchor="middle" class="title">server starts</text><text x="760" y="194" text-anchor="middle" class="small">the game at the address</text>
<path d="M700 182 L690 182 L690 250 L740 250" class="edge" marker-end="url(#a3)"/>
<rect x="740" y="228" width="185" height="48" rx="5" class="soft"/>
<text x="832" y="247" text-anchor="middle" class="small">while hosting: a look at the record every</text>
<text x="832" y="262" text-anchor="middle" class="small">30 s, heartbeat each minute, copies when changed</text>
</g>
<text x="20" y="262" class="small">A stale record (no heartbeat for 3 minutes) or a released one counts as free.</text>
<text x="20" y="278" class="small">If the copy on this PC changed since it last matched the cloud, the launcher asks which of the two is the game.</text>
</svg>
