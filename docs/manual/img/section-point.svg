<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="system-ui, sans-serif"><title>The point of a section</title>
<polygon points="53.4,100.0 140.0,50.0 226.6,100.0 226.6,200.0" fill="#4fb3a5" fill-opacity="0.3" stroke="#4fb3a5" stroke-width="1" stroke-opacity="0.5"/>
<polygon points="226.6,200.0 140.0,250.0 53.4,200.0 53.4,100.0" fill="#d7b263" fill-opacity="0.3" stroke="#d7b263" stroke-width="1" stroke-opacity="0.5"/>
<polygon points="226.6,100.0 226.6,200.0 140.0,250.0 53.4,200.0 53.4,100.0 140.0,50.0" fill="none" stroke="#8b949e" stroke-width="2.0" stroke-linejoin="round"/>
<line x1="226.6" y1="200.0" x2="53.4" y2="100.0" stroke="#4a9fd8" stroke-width="5" stroke-linecap="round"/>
<circle cx="155.8" cy="122.7" r="12.0" fill="#4fb3a5" fill-opacity="0.85"/><text x="155.8" y="126.9" text-anchor="middle" font-size="13.200000000000001" fill="#12100b" font-weight="700">0</text>
<circle cx="124.2" cy="177.3" r="12.0" fill="#d7b263" fill-opacity="0.85"/><text x="124.2" y="181.5" text-anchor="middle" font-size="13.200000000000001" fill="#12100b" font-weight="700">1</text>
<text x="140.0" y="28.0" text-anchor="middle" font-size="13" fill="#c9d1d9" font-weight="600">every section has its point</text>
<text x="140.0" y="282.0" text-anchor="middle" font-size="12" fill="#7d8590" font-weight="500">it is the centroid of the piece, pulled slightly</text>
<text x="140.0" y="300.0" text-anchor="middle" font-size="12" fill="#7d8590" font-weight="500">towards the center so as not to sit on the water</text>
<polygon points="380.0,50.0 466.6,100.0 466.6,200.0 380.0,150.0" fill="#4fb3a5" fill-opacity="0.3" stroke="#4fb3a5" stroke-width="1" stroke-opacity="0.5"/>
<polygon points="293.4,200.0 293.4,100.0 380.0,50.0 380.0,150.0" fill="#d7b263" fill-opacity="0.3" stroke="#d7b263" stroke-width="1" stroke-opacity="0.5"/>
<polygon points="466.6,200.0 380.0,250.0 293.4,200.0 380.0,150.0" fill="#a586d0" fill-opacity="0.3" stroke="#a586d0" stroke-width="1" stroke-opacity="0.5"/>
<polygon points="466.6,100.0 466.6,200.0 380.0,250.0 293.4,200.0 293.4,100.0 380.0,50.0" fill="none" stroke="#8b949e" stroke-width="2.0" stroke-linejoin="round"/>
<line x1="466.6" y1="200.0" x2="380.0" y2="150.0" stroke="#4a9fd8" stroke-width="5" stroke-linecap="round"/>
<line x1="293.4" y1="200.0" x2="380.0" y2="150.0" stroke="#4a9fd8" stroke-width="5" stroke-linecap="round"/>
<line x1="380.0" y1="50.0" x2="380.0" y2="150.0" stroke="#4a9fd8" stroke-width="5" stroke-linecap="round"/>
<circle cx="415.5" cy="129.5" r="12.0" fill="#4fb3a5" fill-opacity="0.85"/><text x="415.5" y="133.7" text-anchor="middle" font-size="13.200000000000001" fill="#12100b" font-weight="700">0</text>
<circle cx="344.5" cy="129.5" r="12.0" fill="#d7b263" fill-opacity="0.85"/><text x="344.5" y="133.7" text-anchor="middle" font-size="13.200000000000001" fill="#12100b" font-weight="700">1</text>
<circle cx="380.0" cy="191.0" r="12.0" fill="#a586d0" fill-opacity="0.85"/><text x="380.0" y="195.2" text-anchor="middle" font-size="13.200000000000001" fill="#12100b" font-weight="700">2</text>
<text x="380.0" y="28.0" text-anchor="middle" font-size="13" fill="#c9d1d9" font-weight="600">confluence: wedges with the center</text>
<text x="380.0" y="282.0" text-anchor="middle" font-size="12" fill="#7d8590" font-weight="500">the stretches all pull towards the middle</text>
</svg>
