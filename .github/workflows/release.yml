# Builds the installed app on every version tag and attaches it to the
# release: the Windows installer and the Linux tarball. The release is
# created as a draft when it does not exist yet, so the owner reviews the
# notes and publishes it by hand.
#
#   git tag -a v1.1.0 -m "Kingmaker Kingdom Manager 1.1.0"
#   git push origin v1.1.0
#
# "Run workflow" on the Actions page builds by hand. Started from a tag
# ("Use workflow from" → Tags → v1.1.6) it attaches the files to that
# release, as a push of the tag would: the way to redo a cancelled or failed
# release run. Started from a branch it only tries the build: nothing is
# attached anywhere, the files are only in the run's artifacts.

name: Release
# A run started by hand has no commit message to show, and the Actions list
# called it only «Release»: the run says which version it builds instead.
run-name: >-
  Kingmaker Kingdom Manager ${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' (run by hand)' || '' }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            pattern: packaging/out/*-Setup.exe
          # ubuntu-22.04 (glibc 2.35): the tarball runs on Ubuntu 22.04 or
          # newer, Debian 12 or newer. Older runners are no longer offered.
          - os: ubuntu-22.04
            label: Linux
            pattern: packaging/out/*-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build and smoke-test
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Kingmaker Kingdom Manager ${{ github.ref_name }}
          files: out/*
          fail_on_unmatched_files: true
